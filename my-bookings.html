<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings — CineHall</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="brand"><span class="brand-mark"></span>CineHall</a>
    <ul class="nav-links">
      <li><a href="index.html">Movies</a></li>
      <li><a href="my-bookings.html" class="active">My Bookings</a></li>
    </ul>
  </div>
</nav>

<div class="container" style="padding:36px 28px 60px;">
  <p class="eyebrow" style="margin-bottom:6px;">Your tickets</p>
  <h1 class="h-display" style="font-size:2rem; margin-bottom:22px;">My Bookings</h1>

  <div class="field" style="max-width:340px;">
    <label for="emailFilter">Look up by email used at checkout</label>
    <input id="emailFilter" type="email" placeholder="you@example.com">
  </div>

  <div id="bookingsList" style="margin-top:20px; display:flex; flex-direction:column; gap:14px;"></div>
</div>

<script src="script.js"></script>
<script>
const listEl = qs('#bookingsList');
const session = DB.getSession();
if(session) qs('#emailFilter').value = session.email;

function render(){
  const email = qs('#emailFilter').value.trim().toLowerCase();
  const bookings = DB.getBookings().filter(b => !email || b.email.toLowerCase()===email);

  if(!bookings.length){
    listEl.innerHTML = `<div class="empty-state"><div class="h-display">No bookings found</div><p>Enter the email you used at checkout, or make a new booking.</p></div>`;
    return;
  }
  listEl.innerHTML = bookings.map(b=>{
    const show = DB.getShow(b.showId);
    const movie = DB.getMovie(b.movieId);
    if(!show || !movie) return '';
    return `
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
      <div>
        <p style="font-weight:700;">${movie.title}</p>
        <p class="muted" style="font-size:.84rem; margin-top:2px;">${show.cinema} · ${fmtDate(show.date)} · ${show.time} · <span class="mono">${b.seats.join(', ')}</span></p>
      </div>
      <div style="text-align:right;">
        <span class="status-badge status-confirmed">${b.status}</span>
        <p class="mono" style="margin-top:6px; color:var(--gold); font-size:.86rem;">${b.code}</p>
      </div>
    </div>`;
  }).join('');
}

qs('#emailFilter').addEventListener('input', render);
render();
</script>
</body>
</html>
